name: Rust quality gates

on:
  pull_request:
    paths: [backend/rust/**, frontend/**, .github/workflows/rust-quality.yml]
  push:
    paths: [backend/rust/**, frontend/**, .github/workflows/rust-quality.yml]

permissions:
  contents: read

env:
  RUST_VERSION: "1.100.0"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/rust
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
      - run: cargo +${{ env.RUST_VERSION }} fmt --all -- --check
      - run: cargo +${{ env.RUST_VERSION }} clippy --locked --all-targets -- -D warnings
      - run: cargo +${{ env.RUST_VERSION }} test --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: ${{ env.RUST_VERSION }}
          manifest-path: backend/rust/Cargo.toml
          arguments: --locked --all-features
          command: check advisories

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo +${{ env.RUST_VERSION }} clippy --locked --all-targets --all-features -- -D warnings
        working-directory: backend/rust
      - run: cargo +${{ env.RUST_VERSION }} test --locked --all-features
        working-directory: backend/rust
