[package]
name = "weibo-plus"
version = "0.1.0"
edition = "2024"
publish = false

[features]
embed-frontend = ["dep:mime_guess", "dep:rust-embed"]
desktop = ["embed-frontend", "dep:tao", "dep:windows-sys", "dep:wry"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
html-escape = "0.2"
md5 = "0.8"
mime_guess = { version = "2", optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rust-embed = { version = "8", optional = true, features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
utoipa-swagger-ui = { version = "10", default-features = false, features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
tao = { version = "0.37", default-features = false, features = ["rwh_06"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"], optional = true }
wry = { version = "0.57", default-features = false, optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(not(windows))'.dependencies]
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
