[package]
name = "weibo-plus"
version = "0.1.0"
edition = "2024"
publish = false

[features]
embed-frontend = ["dep:mime_guess", "dep:rust-embed"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
mime_guess = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rust-embed = { version = "8", optional = true, features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
