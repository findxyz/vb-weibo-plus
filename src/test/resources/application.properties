# 测试与真实数据彻底隔离。注意：不能用 weibo.database-path 间接覆盖，
# application.yml 里 spring.datasource.url 的 ${weibo.database-path} 占位符
# 在测试环境不会采纳这里的值（已实测），必须直接覆盖最终 URL。
# 库与 cookie 一律落在 target/ 下，同步群号留空禁止向真实微博拉取。
weibo.database-path=target/test-weibo.db
spring.datasource.url=jdbc:sqlite:target/test-weibo.db?busy_timeout=5000&journal_mode=WAL
weibo.cookie-file=target/test-cookie.txt
weibo.chat.auto-sync-gids=
