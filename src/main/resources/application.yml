server:
  port: 8080

springdoc:
  paths-to-match:
    - /post/**
    - /chat/**
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
  api-docs:
    enabled: false

weibo:
  cookie-file: .weibo_cookie.txt
  qr-timeout-seconds: 300
  database-path: ${WEIBO_DATABASE_PATH:weibo.db}
  chat:
    # auto-sync-gids：定时增量同步的群号，逗号分割，留空则不同步
    auto-sync-gids: ${WEIBO_AUTO_SYNC_GIDS:4761715839862414}
    # sync-group-fixed-delay：群消息增量同步间隔，支持 20s / 30000ms 等 Duration 写法
    sync-group-fixed-delay: ${WEIBO_SYNC_GROUP_FIXED_DELAY:20s}
  media:
    ffmpeg-path: ${WEIBO_FFMPEG_PATH:ffmpeg}

spring:
  servlet:
    # max-file-size：单个上传文件上限，群聊发图需要容纳手机原图
    # max-request-size：整个 multipart 请求上限，略大于文件上限即可
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    # busy_timeout：撞锁时让 SQLite 等待 5 秒再重试，而不是立即抛 SQLITE_BUSY
    # journal_mode=WAL：开启预写式日志，读不阻塞写、写不阻塞读，缓解 /chat/since 与后台 SyncTask 并发写同一文件
    url: jdbc:sqlite:${weibo.database-path}?busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
