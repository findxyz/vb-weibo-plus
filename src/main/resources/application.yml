server:
  port: 18080

springdoc:
  paths-to-match:
    - /post/**
    - /chat/**
  swagger-ui:
    path: /swagger-ui.html
    enabled: false
  api-docs:
    enabled: false

weibo:
  cookie-file: .weibo_cookie.txt
  qr-timeout-seconds: 300
  database-path: ${WEIBO_DATABASE_PATH:weibo.db}
  chat:
    auto-sync-gids: ${WEIBO_AUTO_SYNC_GIDS:4761715839862414,5046020575330655}
    sync-group-fixed-delay: ${WEIBO_SYNC_GROUP_FIXED_DELAY:1m}
  media:
    ffmpeg-path: ${WEIBO_FFMPEG_PATH:ffmpeg}
  ai:
    base-url: ${WEIBO_AI_BASE_URL:}
    api-key: ${WEIBO_AI_API_KEY:}
    model: ${WEIBO_AI_MODEL:deepseek-v4-flash}
    timeout-seconds: ${WEIBO_AI_TIMEOUT:120}
    system-prompt: ${WEIBO_AI_SYSTEM_PROMPT:请用中文回复分析结果。}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: jdbc:sqlite:${weibo.database-path}?busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
