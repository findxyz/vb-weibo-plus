<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>本地微博</title>
  <link rel="stylesheet" href="post.css">
  <script src="post.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="titlebar" data-od-id="titlebar">
      <span class="title-logo" aria-hidden="true">
        <img src="assets/weibo-logo.svg" alt="">
      </span>
      <h1 id="app-title">本地微博</h1>
      <div class="window-controls">
        <button class="window-control toggle" type="button" aria-label="切换到微博群聊" title="切换到微博群聊"></button>
      </div>
    </header>

    <div class="workspace" data-od-id="workspace">
      <aside class="bloggers-panel" aria-label="博主列表" data-od-id="bloggers-panel">
        <header class="bloggers-heading">
          <h2>博主列表</h2>
          <span id="bloggers-count">正在加载…</span>
          <button id="blogger-add" class="blogger-add" type="button" title="添加博主" aria-label="添加博主"></button>
        </header>
        <label class="search-box">
          <span class="visually-hidden">搜索博主</span>
          <input id="blogger-search" type="search" placeholder="搜索博主">
        </label>
        <div class="bloggers-list" id="bloggers-list" aria-live="polite">
          <button class="blogger-row all-bloggers" type="button" data-uid="">
            <span class="blogger-avatar all-avatar">微</span>
            <div class="blogger-info">
              <div class="blogger-name">全部博主</div>
            </div>
          </button>
        </div>
        <div class="panel-feedback">
          <div class="panel-state" id="bloggers-state" role="status"></div>
        </div>
        <div class="login-expired" id="login-expired" role="status" hidden>
          <span class="panel-state">登录已失效</span>
          <button id="login-qr" type="button">扫码登录</button>
        </div>
      </aside>

      <aside class="dates-panel" aria-label="日期时间轴" data-od-id="dates-panel">
        <header class="dates-heading">
          <h2>日期</h2>
          <span id="dates-state"></span>
        </header>
        <div class="dates-list" id="dates-list" aria-live="polite"></div>
      </aside>

      <section class="feed" aria-label="微博列表" data-od-id="feed-panel">
        <header class="feed-header">
          <h2 id="current-filter">全部微博</h2>
          <span id="feed-count" class="feed-count"></span>
          <button id="sync-history-open" class="sync-history-open" type="button" hidden>同步历史</button>
        </header>

        <div class="posts-shell">
          <div class="posts" id="posts" aria-live="polite"></div>
          <div class="posts-feedback">
            <div class="posts-state" id="posts-state" role="status">正在加载…</div>
            <button id="retry-posts" type="button" hidden>重试</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <dialog class="add-blogger" id="add-blogger" aria-labelledby="add-blogger-title">
    <div class="add-blogger-window">
      <header class="add-blogger-titlebar">
        <span class="add-blogger-title-icon" aria-hidden="true"></span>
        <h2 id="add-blogger-title">添加博主</h2>
        <button id="add-blogger-cancel" type="button" aria-label="关闭添加博主"></button>
      </header>
      <div class="add-blogger-body">
        <p class="add-blogger-tip">输入博主 UID 或主页链接，例如 https://weibo.com/u/1234567890，添加后会立即拉取最新一页微博。</p>
        <input id="add-blogger-input" type="text" placeholder="UID 或主页链接" autocomplete="off">
        <p class="add-blogger-error" id="add-blogger-error" role="alert"></p>
        <div class="add-blogger-actions">
          <button id="add-blogger-submit" type="button">添加</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="sync-history" id="sync-history" aria-labelledby="sync-history-title">
    <div class="sync-history-window">
      <header class="sync-history-titlebar">
        <span class="sync-history-title-icon" aria-hidden="true"></span>
        <h2 id="sync-history-title">同步历史微博</h2>
        <button id="sync-history-cancel" type="button" aria-label="关闭同步历史微博"></button>
      </header>
      <div class="sync-history-body">
        <p class="sync-history-tip">按天拉取 <b id="sync-history-blogger"></b> 在选定范围内的微博，已存在的会自动跳过；范围越大耗时越久，同步在服务端执行，发起后弹窗会自动关闭，完成后日期面板自动刷新。若已有同步任务在运行，本次请求会被跳过。</p>
        <label class="sync-history-field">开始日期
          <input id="sync-history-start" type="date">
        </label>
        <label class="sync-history-field">结束日期
          <input id="sync-history-end" type="date">
        </label>
        <p class="sync-history-status" id="sync-history-status" role="alert"></p>
        <div class="sync-history-actions">
          <button id="sync-history-submit" type="button">开始同步</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="image-viewer" id="image-viewer" aria-label="查看原图">
    <img alt="微博原图">
    <p id="image-viewer-state" role="status"></p>
    <button class="viewer-prev" type="button" aria-label="上一张" hidden>‹</button>
    <button class="viewer-next" type="button" aria-label="下一张" hidden>›</button>
    <span class="viewer-counter" id="viewer-counter" hidden></span>
  </dialog>
</body>
</html>
