<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>微博群聊</title>
  <link rel="stylesheet" href="chat.css">
  <script src="weibo-emoji.js" defer></script>
  <script src="marked.min.js" defer></script>
  <script src="chat.js" defer></script>
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="titlebar">
      <span class="title-logo" aria-hidden="true">
        <img src="assets/weibo-logo.svg" alt="">
      </span>
      <h1 id="app-title">微博群聊</h1>
      <div class="window-controls">
        <button class="window-control toggle" type="button" aria-label="切换到本地微博" title="切换到本地微博"></button>
      </div>
    </header>

    <div class="workspace">
      <aside class="groups-panel" aria-label="群聊列表">
        <header class="groups-heading">
          <h2>群聊列表</h2>
          <span id="groups-count">正在加载…</span>
        </header>
        <label class="search-box">
          <span class="visually-hidden">搜索群聊</span>
          <input id="group-search" type="search" placeholder="搜索群聊">
        </label>
        <div class="groups-list" id="groups-list" aria-live="polite"></div>
        <div class="panel-feedback">
          <div class="panel-state" id="groups-state" role="status"></div>
          <button id="retry-groups" type="button" hidden>🔄 重试</button>
        </div>
        <div class="login-expired" id="login-expired" role="status" hidden>
          <img id="login-qr-img" alt="扫码登录二维码" hidden>
          <span class="panel-state">登录已失效</span>
          <button id="login-qr" type="button">📱 扫码登录</button>
        </div>
      </aside>

      <section class="conversation" aria-label="聊天内容">
        <header class="group-header">
          <span class="main-group-avatar" id="current-group-avatar" aria-hidden="true">群</span>
          <div class="group-summary">
            <div class="group-title-line">
              <h2 id="current-group">请选择群聊</h2>
            </div>
            <div class="group-number">群号：<span id="current-id">-</span></div>
            <div id="current-size"></div>
          </div>
        </header>

        <div class="messages-shell">
          <button class="load-earlier-button" id="load-earlier" type="button"
                  disabled hidden>加载更早消息</button>
          <div class="messages" id="messages" aria-live="polite"></div>
          <div class="messages-feedback">
            <div class="messages-state" id="messages-state" role="status">请选择群聊</div>
            <button id="retry-messages" type="button" hidden>🔄 重试</button>
          </div>
          <button class="new-messages-button" id="new-messages" type="button" hidden>有新消息</button>
        </div>

        <div class="composer" aria-label="消息编辑器">
          <div class="composer-tools">
            <button id="emoji-picker-open" type="button" disabled>😊 表情</button>
            <button id="image-picker-open" type="button" disabled>
              <span class="composer-tool-emoji" aria-hidden="true">🖼️</span>
              图片
            </button>
            <input id="image-input" type="file" accept="image/*" hidden>
            <button id="video-picker-open" type="button" disabled>
              <span class="composer-tool-emoji" aria-hidden="true">🎬</span>
              视频
            </button>
            <input id="video-input" type="file" accept="video/mp4" hidden>
            <button id="history-open" type="button" disabled>📜 聊天记录</button>
            <button id="analysis-open" type="button" disabled>🤖 群聊分析</button>
          </div>
          <div class="composer-attachment" id="composer-attachment" hidden tabindex="0">
            <img class="composer-attachment-preview" id="composer-attachment-preview" alt="">
            <video class="composer-attachment-preview-video" id="composer-attachment-preview-video" hidden muted></video>
            <button class="composer-attachment-remove" id="composer-attachment-remove" type="button" aria-label="删除附件">✕</button>
          </div>
          <div class="emoji-panel" id="emoji-panel" hidden role="dialog" aria-label="表情选择">
            <div class="emoji-panel-tabs"></div>
            <div class="emoji-panel-grid" id="emoji-panel-grid"></div>
          </div>
          <textarea id="composer" aria-label="输入消息" placeholder="输入消息后按 Enter 发送"></textarea>
          <span class="composer-hint" id="composer-hint" aria-hidden="true">按下 Enter 发送内容 / Shift+Enter 换行</span>
        </div>
      </section>
    </div>
  </main>

  <dialog class="image-viewer" id="image-viewer" aria-label="查看原图">
    <img alt="消息原图">
    <p id="image-viewer-state" role="status"></p>
  </dialog>

  <dialog class="history-dialog" id="history-dialog" aria-labelledby="history-title">
    <div class="history-window">
      <header class="history-titlebar">
        <span class="history-title-icon" aria-hidden="true">📖</span>
        <h2 id="history-title">聊天记录</h2>
        <button id="history-close" type="button" aria-label="关闭聊天记录"></button>
      </header>
      <div class="history-layout">
        <form class="history-filters" id="history-form">
          <h3>筛选条件</h3>
          <label for="history-start">开始日期</label>
          <input id="history-start" type="date">
          <label for="history-end">结束日期</label>
          <input id="history-end" type="date">
          <label for="history-sender">用户</label>
          <input id="history-sender" type="search" placeholder="精确昵称">
          <label for="history-keyword">内容</label>
          <input id="history-keyword" type="search" placeholder="包含关键词">
          <button class="primary-button" type="submit">🔍 查询</button>
          <label for="history-sync-time">同步历史至</label>
          <input id="history-sync-time" type="date">
          <button id="history-sync" type="button">⬇️ 同步历史</button>
        </form>
        <section class="history-content" aria-label="聊天记录查询结果">
          <div class="history-empty" id="history-empty">设置筛选条件后点击查询</div>
          <div class="history-results" id="history-results" hidden>
            <div class="history-results-list" id="history-results-list"></div>
            <footer class="history-pagination">
              <button id="history-previous" type="button">⬅️ 上一页</button>
              <span id="history-page-state"></span>
              <button id="history-next" type="button">下一页 ➡️</button>
            </footer>
          </div>
          <div class="history-context" id="history-context" hidden>
            <header class="history-context-toolbar">
              <button id="history-back" type="button">🚩 返回搜索结果</button>
            </header>
            <div class="history-messages-shell">
              <div class="history-edge-state" id="history-earlier-state" role="status"></div>
              <div class="history-messages" id="history-messages"></div>
              <div class="history-edge-state" id="history-newer-state" role="status"></div>
            </div>
          </div>
          <div class="history-feedback" id="history-feedback" role="status"></div>
        </section>
      </div>
    </div>
  </dialog>

  <dialog class="analysis-dialog" id="analysis-dialog" aria-labelledby="analysis-title">
    <div class="analysis-window">
      <header class="analysis-titlebar">
        <span class="analysis-title-icon" aria-hidden="true">🤖</span>
        <h2 id="analysis-title">群聊分析</h2>
        <button id="analysis-close" type="button" aria-label="关闭群聊分析"></button>
      </header>
      <div class="analysis-layout">
        <form class="analysis-filters" id="analysis-form">
          <h3>分析条件</h3>
          <label for="analysis-date">分析日期</label>
          <input id="analysis-date" type="date" required>
          <label for="analysis-prompt">提示词</label>
          <textarea id="analysis-prompt" rows="5" required>请总结今天群聊的主要讨论话题和参与者</textarea>
          <button class="primary-button" id="analysis-submit" type="submit">🤖 分析</button>
        </form>
        <section class="analysis-content" aria-label="群聊分析结果">
          <div class="analysis-empty" id="analysis-empty">设置分析条件后点击分析</div>
          <div class="analysis-results" id="analysis-results" hidden>
            <div class="analysis-results-list" id="analysis-list"></div>
            <footer class="analysis-pagination">
              <button id="analysis-prev" type="button">⬅️ 上一页</button>
              <span id="analysis-page-state"></span>
              <button id="analysis-next" type="button">下一页 ➡️</button>
            </footer>
          </div>
          <div class="analysis-detail" id="analysis-detail" hidden>
            <header class="analysis-detail-toolbar">
              <button id="analysis-back" type="button">🚩 返回分析列表</button>
              <button id="analysis-download" type="button" disabled>⬇️ 下载 MD</button>
            </header>
            <div class="analysis-detail-meta" id="analysis-detail-meta" hidden></div>
            <div class="analysis-detail-content" id="analysis-detail-content"></div>
          </div>
          <div class="analysis-feedback" id="analysis-feedback" role="status"></div>
        </section>
      </div>
    </div>
  </dialog>
</body>
</html>
