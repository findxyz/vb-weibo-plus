const SS = 2;                            // 超采样倍数：像素细腻一半
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
ctx.scale(SS, SS);                       // 背板 512x480，按逻辑坐标绘制

function fit(){
  const raw = Math.min(innerWidth / W, (innerHeight - 8) / H);
  const s = Math.max(2, 2 * Math.floor(raw / 2));   // 取偶数倍，避免放大像素不均匀
  cv.style.width = W * s + "px";
  cv.style.height = H * s + "px";
}
addEventListener("resize", fit); fit();

/* ================= 像素帧 -> 离屏画布 ================= */
function sprite(rows, pal){
  const h = rows.length;
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++){
    const col = pal[rows[y][x]];
    if (col){ g.fillStyle = col; g.fillRect(x, y, 1, 1); }
  }
  return c;
}

// 裁掉帧底部空行（部分帧脚底下方留白），保证脚底贴合地面锚点
function trimBottom(img){
  const g = img.getContext("2d");
  const d = g.getImageData(0, 0, img.width, img.height).data;
  let last = img.height - 1;
  for (let y = img.height - 1; y >= 0; y--){
    let any = false;
    for (let x = 0; x < img.width; x++) if (d[(y * img.width + x) * 4 + 3] > 40){ any = true; break; }
    if (any){ last = y; break; }
  }
  if (last === img.height - 1) return img;
  const c = document.createElement("canvas"); c.width = img.width; c.height = last + 1;
  c.getContext("2d").drawImage(img, 0, 0);
  return c;
}

/* ================= 8-bit 音效（WebAudio 合成） ================= */
let AC = null, master = null, muted = false;
let noiseBuf = null;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);

function ensureAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.5;
  master.connect(AC.destination);
  window.BGM_BUF = {};
  for (const k of ["title", "level"]){
    fetch(window.BGM_DATA[k]).then(r => r.arrayBuffer())
      .then(ab => AC.decodeAudioData(ab))
      .then(buf => {
        window.BGM_BUF[k] = buf;
        if (bgmKind === k && !bgmNode) startBGMNode(k);
        else if (state === "title" || state === "over") playBGM("title");
      }).catch(() => {});
  }
}
function beep(f, d, type, v, when, slide){
  if (!AC) return;
  const t = when || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(v || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + d + 0.02);
}
function noiseHit(dur, freq, vol){
  if (!AC) return;
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3 | 0, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 1.1;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + 0.02);
}
function jingle(notes){
  if (!AC) return;
  let t = AC.currentTime + 0.02;
  for (const [n, dt] of notes){ beep(midi(n), dt * 0.95, "square", 0.12, t); t += dt; }
}
const SFX = {
  door()   { jingle([[72,.09],[76,.09],[79,.09],[84,.22]]); },
  clear()  { jingle([[72,.1],[72,.1],[72,.1],[76,.16],[79,.16],[84,.3]]); },
  caught() { beep(220, .5, "sawtooth", .14, 0, -140); beep(160, .55, "square", .1, .12, -90); },
  jump()   { beep(300, .16, "square", .07, 0, 320); },
  land()   { beep(110, .07, "square", .09); noiseHit(.06, 350, .07); },
  skid()   { beep(1500, .17, "sawtooth", .05, 0, -1150); noiseHit(.17, 1700, .09); },
  step()   { noiseHit(.03, 600, .028); },
  stop_()  { beep(880, .08, "sine", .06); },
  start()  { jingle([[76,.08],[81,.08],[88,.2]]); }
};
let bgmNode = null, bgmKind = null;
function startBGMNode(which){
  if (bgmNode){ try{ bgmNode.stop(); }catch(e){} bgmNode = null; }
  const src = AC.createBufferSource(); src.buffer = window.BGM_BUF[which]; src.loop = true;
  const g = AC.createGain(); g.gain.value = 0.6;
  src.connect(g); g.connect(master); src.start();
  bgmNode = src;
}
function playBGM(which){
  if (!AC || bgmKind === which) return;
  stopBGM();
  bgmKind = which;
  if (window.BGM_BUF && window.BGM_BUF[which]) startBGMNode(which);
}
function stopBGM(){ bgmKind = null; if (bgmNode){ try{ bgmNode.stop(); }catch(e){} bgmNode = null; } }
function startBGM(){ playBGM("level"); }
function toggleMute(){ muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; }

const keys = {};
const KEYMAP = {
  ArrowLeft:"left", KeyA:"left", ArrowRight:"right", KeyD:"right",
  ArrowUp:"up", KeyW:"up", ArrowDown:"down", KeyS:"down",
  Space:"jump", Enter:"start", KeyM:"mute"
};
const KEY_FALLBACK = {
  ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down",
  a:"left", d:"right", w:"up", s:"down", A:"left", D:"right", W:"up", S:"down",
  " ":"jump", Enter:"start", m:"mute", M:"mute"
};
function keyOf(e){ return KEYMAP[e.code] || KEY_FALLBACK[e.key]; }
addEventListener("keydown", e => {
  const k = keyOf(e); if (!k) return;
  e.preventDefault(); ensureAudio();
  if (k === "mute" && !keys.mute) toggleMute();
  if (k === "start" && !keys.start) pressStart();
  keys[k] = true;
});
addEventListener("keyup", e => { const k = keyOf(e); if (k) keys[k] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
cv.addEventListener("pointerdown", () => { ensureAudio(); pressStart(); });

if (matchMedia("(pointer: coarse)").matches) document.getElementById("touch").classList.add("on");
document.querySelectorAll("[data-k]").forEach(b => {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", e => { e.preventDefault(); ensureAudio(); keys[k] = true; });
  for (const ev of ["pointerup","pointercancel","pointerleave"])
    b.addEventListener(ev, () => { keys[k] = false; });
});

function groundYAt(x){
  if (roomType === 0){
    if (x < 76)  return Math.max(158, ROOM_W.floor - (76 - x) * 1.15);
    if (x > 180) return Math.max(158, ROOM_W.floor - (x - 180) * 1.15);
  }

}
function supportUnder(x, y){
  let s = groundYAt(x);
  for (const pl of PLATS[roomType])
    if (pl.state !== "gone" && x >= pl.x - 3 && x <= pl.x + pl.w + 3 && pl.y >= y - 1 && pl.y < s) s = pl.y;

}

const VMAX = 84;
const JUMP_V = -360, G_HOLD = 900, G_UP = 2100, G_DOWN = 1500, MAX_FALL = 430;

function curDoorTime(){ return DBG.door || Math.min(20, 14 + (round - 1) * 1.5); }
function curESpeed(){ return Math.min(64, (DBG.es || 48) + (round - 1) * 4); }

function resetRoom(){
  P.x = 44; P.y = groundYAt(44); P.vx = 0; P.vy = 0; P.onGround = true; P.plat = null;

  E.facing = P.x > E.x ? 1 : -1;      // 开场面向米妮

  for (const pl of PLATS[roomType]){ pl.state = "solid"; pl.t = 0; }   // 平台复位
}
function newGame(){

  parts = []; floats = [];
  resetRoom();
  startBGM();                          // 过场起就放关卡曲

}
function pressStart(){ if (state === "title" || state === "over") newGame(); }
function caught(){
  state = "caught"; stT = 1.8; lives--; shake = 0.35;
  SFX.caught();
  for (let i = 0; i < 14; i++) parts.push({
    x: P.x, y: P.y - 14, vx: (Math.random() - .5) * 60, vy: -30 - Math.random() * 50,
    t: 1 + Math.random() * .5, kind: "heart"
  });

}
function enterDoor(){
  state = "clear"; stT = 1.7;
  const bonus = 1000 * round;
  score += bonus;
  let msg;
  if (lives < 6){ lives++; msg = "1UP！ +" + bonus; }       // 每次过关都加命（上限 6）
  else msg = "生命已满 +" + bonus;
  floats.push({ text: msg, t: 1.7, color: lives >= 6 ? "#ffd24a" : "#8affa0" });
  SFX.clear();
}
function nextRound(){
  round++; roomType = (round - 1) % 3; doorTime = curDoorTime();
  parts = [];
  resetRoom();
  state = "start"; stT = 1.5;
  floats.push({ text: "第 " + round + " 关 · " + ROOMS[roomType].name, t: 1.5, color: "#9fd8ff" });
}

/* ================= 更新 ================= */
function update(dt){
  shake = Math.max(0, shake - dt);
  parts.forEach(p => { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.kind === "heart" ? -20 : 140) * dt; });
  parts = parts.filter(p => p.t > 0);
  floats.forEach(f => f.t -= dt);
  floats = floats.filter(f => f.t > 0);
  P.animT += dt; E.animT += dt;
  P.stretch = Math.max(0, P.stretch - 3 * dt);
  P.squashT = Math.max(0, P.squashT - dt);

  if (state === "start"){
    stT -= dt; graceT -= dt;
    if (stT <= 0){ state = "play"; graceT = 0.4; startBGM(); }
    return;
  }
  if (state === "caught"){
    stT -= dt;
    if (stT <= 0){
      if (lives <= 0){ state = "over"; playBGM("title"); }
      else { resetRoom(); state = "start"; stT = 1.0; }
    }
    return;
  }
  if (state === "clear"){
    stT -= dt;
    if (stT <= 0) nextRound();
    return;
  }
  if (state !== "play") return;

  graceT -= dt;

  /* --- 玩家：原版式操控，按住即全速、松手即停 --- */
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir !== 0){
    if (dir !== P.facing){                      // 掉头：刹车音 + 清掉旧尘土 + 身后扬尘
      SFX.skid();
      parts = parts.filter(p => p.kind !== "dust");
      for (let i = 0; i < 2; i++)
        parts.push({ x: P.x - dir * 18, y: P.y - 2 - i * 3, vx: -dir * 34, vy: -12, t: .18, kind: "dust" });
    }
    P.facing = dir;
  }
  P.vx = dir * VMAX;

  /* --- 跳跃：起跳拉伸、按住滞空、下落加速、落地压扁 --- */
  const prevY = P.y;
  if (keys.jump && P.onGround){
    P.vy = JUMP_V; P.onGround = false; P.plat = null; P.stretch = 1;
    SFX.jump();
    for (let i = 0; i < 4; i++)
      parts.push({ x: P.x - 4 + i * 3, y: P.y, vx: (i - 1.5) * 26, vy: 12, t: .3, kind: "dust" });
  }
  if (!P.onGround){
    const g = P.vy < 0 ? (keys.jump ? G_HOLD : G_UP) : G_DOWN;
    P.vy = Math.min(MAX_FALL, P.vy + g * dt);
  }
  P.dropT = Math.max(0, P.dropT - dt);
  P.x = Math.max(16, Math.min(240, P.x + P.vx * dt));
  P.y += P.vy * dt;

  let sup = groundYAt(P.x), onPlat = null;
  if (P.vy >= 0 && P.dropT <= 0){
    for (const pl of PLATS[roomType]){
      if (pl.state === "gone") continue;                      // 已消失的平台不承接
      if (prevY <= pl.y + 0.01 && P.y >= pl.y && P.x >= pl.x - 3 && P.x <= pl.x + pl.w + 3){
        sup = pl.y; onPlat = pl; break;
      }
    }
  }
  if (P.y >= sup){
    if (!P.onGround){
      P.squashT = 0.14; SFX.land();
      for (let i = 0; i < 4; i++)
        parts.push({ x: P.x + (i - 1.5) * 6, y: sup, vx: (i - 1.5) * 30, vy: 10, t: .3, kind: "dust" });
    }
    P.y = sup; P.vy = 0; P.onGround = true; P.plat = onPlat;
  } else if (P.onGround && P.vy >= 0 && sup - P.y < 6){
    P.y = sup; P.plat = onPlat;
  } else P.onGround = false;
  if (P.onGround && !P.plat) P.y = groundYAt(P.x);
  if (P.onGround && keys.down && P.plat){ P.dropT = 0.3; P.onGround = false; P.y += 2; }
  P.y = Math.max(ROOM_W.ceil + 16, P.y);

  /* --- 限时平台：踩上即触发，之后无论是否离开都会 1s 后闪烁、2s 消失、再 2s 恢复 --- */
  for (const pl of PLATS[roomType]){
    const stood = P.plat === pl && P.onGround;
    if (stood && pl.state === "solid" && !(pl.t > 0)) pl.t = 0.0001;   // 踩上触发，离开不重置
    if (pl.state === "gone"){
      pl.t -= dt;
      if (pl.t <= 0){ pl.state = "solid"; pl.t = 0; }                  // 恢复后回到待触发状态
    } else if (pl.t > 0){
      pl.t += dt;
      if (pl.state === "solid" && pl.t >= 1) pl.state = "blink";
      else if (pl.state === "blink" && pl.t >= 2){
        pl.state = "gone"; pl.t = 2;                 // 消失 2s
        if (P.plat === pl){ P.plat = null; P.onGround = false; }     // 脚下平台没了 → 坠落
      }
    }
  }

  // 跑步尘土：只在较快时生成、且生成在身体轮廓外，避免和角色叠成"重影"
  const spd = Math.abs(P.vx);
  if (P.onGround && spd > 10) P.runPhase += (5 + spd / 16) * dt;   // 跑步帧相位（单调递增，不乱跳）
  if (P.onGround && spd > 50 && Math.random() < dt * (spd / 12))
    parts.push({ x: P.x - P.facing * 18, y: P.y - 2, vx: -P.facing * 20, vy: -14, t: .2, kind: "dust" });
  if (P.onGround && spd > 40){
    const ph = Math.floor(P.runPhase) % 4;
    if (ph !== P.stepPh && (ph === 0 || ph === 2)) SFX.step();
    P.stepPh = ph;
  }

  /* --- Elmyra：地面追逐 + 喘气停顿，落后太远会加速追赶 --- */
  E.y = groundYAt(E.x);
  if (graceT <= 0){
    E.timer -= dt;
    if (E.state === "chase"){
      const d = P.x - E.x;
      E.turnCD = (E.turnCD || 0) - dt;
      if (E.turnCD <= 0 && Math.abs(d) > 8){        // 转向延迟：原作 Elmyra/米奇的迟钝感
        E.facing = d > 0 ? 1 : -1;
        E.turnCD = 0.35;
      }
      const base = curESpeed();
      const spd2 = Math.abs(d) > 140 ? Math.min(base * 1.25, 76) : base;
      E.x = Math.max(16, Math.min(240, E.x + E.facing * spd2 * dt));
      E.heartT -= dt;
      if (E.heartT <= 0){
        E.heartT = 0.38;
        parts.push({ x: E.x + E.facing * 4, y: E.y - 30, vx: (Math.random() - .5) * 12, vy: -22, t: .9, kind: "heart" });
      }
      if (E.timer <= 0){ E.state = "stop"; E.timer = Math.max(1.4, 1.7 - (round - 1) * 0.05); SFX.stop_(); }
    } else {
      if (E.timer <= 0){ E.state = "chase"; E.timer = 2.8 + Math.random() * 1.6; }
      if (Math.random() < dt * 6)
        parts.push({ x: E.x + E.facing * 9, y: E.y - 30, vx: E.facing * 10, vy: 10, t: .5, kind: "sweat" });
    }
  }

  /* --- 抓捕判定（跳过她头顶就安全） --- */
  if (graceT <= 0 && Math.abs(P.x - E.x) < 13 && Math.abs(P.y - E.y) < 18){ caught(); return; }

  /* --- 倒计时开门 --- */
  survT += dt; score += dt * 10;
  if (!door && survT >= doorTime){
    door = { x: ROOMS[roomType].doorX, y: groundYAt(ROOMS[roomType].doorX) };
    doorAge = 0;
    SFX.door();
    floats.push({ text: "门出现了！趁他停下时钻进去！", t: 2.2, color: "#ffd24a" });
  }
  if (door){
    doorAge += dt;
    if (Math.abs(P.x - door.x) < 10 && Math.abs(P.y - door.y) < 20){ enterDoor(); return; }
  }
}

/* ================= 绘制 ================= */
function text(s, x, y, size, color, align, bold){
  ctx.font = (bold ? "bold " : "") + size + "px 'Microsoft YaHei','SimHei',sans-serif";
  ctx.textAlign = align || "center"; ctx.textBaseline = "top";
  ctx.fillStyle = "#000";
  for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]]) ctx.fillText(s, x + ox, y + oy);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function drawSpr(img, cx, footY, flip, sx, sy){
  sx = sx || 1; sy = sy || 1;
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(footY));
  ctx.scale(flip ? -sx : sx, sy);
  ctx.drawImage(img, -Math.round(img.width / 2), -(img.height - 1));
  ctx.restore();
}
function shadowAt(x, supY, h, r){
  const rr = Math.max(2.5, r - Math.min(3, h * 0.05));
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(x, supY, rr, rr * 0.4, 0, 0, 7); ctx.fill();
}
function brickBand(x, y, w, h, c1, c2){
  ctx.fillStyle = c1; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = c2;
  for (let yy = y; yy < y + h; yy += 6){
    const off = ((yy - y) / 6) % 2 ? 8 : 0;
    for (let xx = x + off; xx < x + w; xx += 16) ctx.fillRect(xx, yy, 1, 5);
    ctx.fillRect(x, yy + 5, w, 1);
  }
}
const THEMES = [
  { bg:"#c88a28", dk:"#a06a18", floor:"#e0a860", floorTop:"#f8d8a0", plat:"#d82800", platTop:"#f85838" },
  { bg:"#3a9848", dk:"#2a7838", floor:"#90b858", floorTop:"#c0e048", plat:"#f8f8f8", platTop:"#e0f8d0" },
  { bg:"#d84848", dk:"#b83030", floor:"#f8d0a0", floorTop:"#f8ecc8", plat:"#f8b800", platTop:"#f8e048" }
];
function drawRoom(){
  const th = THEMES[roomType];
  ctx.fillStyle = "#101020"; ctx.fillRect(0, 0, W, H);
  brickBand(0, 24, W, H - 24, th.bg, th.dk);
  if (roomType === 0){
    ctx.fillStyle = th.dk;
    for (const [rx, ry, rw] of [[40,60,10],[150,52,12],[210,120,9],[70,140,8],[120,90,11],[190,70,8]])
      ctx.fillRect(rx, ry, rw, rw - 3);
  } else if (roomType === 1){
    ctx.fillStyle = "#2a7a88";
    for (const [rx, rh] of [[34,26],[58,18],[196,24],[220,16]]) ctx.fillRect(rx, ROOM_W.floor - rh - 12, 4, rh);
  } else {
    ctx.strokeStyle = "#1e5024"; ctx.lineWidth = 2;
    for (const vx of [52, 128, 204]){
      ctx.beginPath(); ctx.moveTo(vx, 24);
      ctx.bezierCurveTo(vx + 8, 70, vx - 8, 120, vx + 4, 170); ctx.stroke();
    }
  }
  ctx.fillStyle = th.floor;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 4) ctx.lineTo(x, groundYAt(x));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = th.floorTop;
  for (let x = 0; x <= W; x += 4) ctx.fillRect(x, groundYAt(x), 4, 2);
  ctx.fillStyle = "#241428"; ctx.fillRect(0, 24, 14, H - 24); ctx.fillRect(242, 24, 14, H - 24);
  brickBand(0, 24, W, 10, th.dk, th.bg);
  // 每关顶部标牌：米奇妙妙屋
  text("米奇妙妙屋", 128, 6, 13, "#f8d048", "center", true);
  ctx.fillStyle = th.dk; ctx.fillRect(30, 21, 196, 2);
  for (const pl of PLATS[roomType]){
    if (pl.state === "gone") continue;                                  // 消失中不绘制
    if (pl.state === "blink" && Math.floor(pl.t * 10) % 2) continue;    // 闪烁警告
    ctx.fillStyle = "#241428"; ctx.fillRect(pl.x - 1, pl.y - 1, pl.w + 2, 8);
    ctx.fillStyle = th.plat; ctx.fillRect(pl.x, pl.y, pl.w, 6);
    ctx.fillStyle = th.platTop; ctx.fillRect(pl.x, pl.y, pl.w, 2);
  }
  if (door){
    const d = door, dx = Math.round(d.x), dy = Math.round(d.y);
    ctx.fillStyle = "#241428"; ctx.fillRect(dx - 11, dy - 30, 22, 30);
    ctx.fillStyle = "#8a5424"; ctx.fillRect(dx - 9, dy - 28, 18, 28);
    ctx.fillStyle = "#a86c30"; ctx.fillRect(dx - 7, dy - 26, 14, 26);
    ctx.fillStyle = "#5c3814"; ctx.fillRect(dx - 7, dy - 14, 14, 2);
    ctx.fillStyle = "#ffd24a"; ctx.fillRect(dx + 4, dy - 13, 2, 2);
    if (doorAge < 4 && Math.floor(doorAge * 6) % 2 === 0) text("▼", dx, dy - 44, 10, "#ffd24a");
    if (doorAge < 1.2) for (let i = 0; i < 3; i++){
      const a = doorAge * 10 + i * 2.1;
      ctx.fillStyle = i % 2 ? "#fff" : "#ffd24a";
      ctx.fillRect(dx + Math.cos(a) * 16, dy - 15 + Math.sin(a) * 20, 2, 2);
    }
  }
}
function playerSprite(){
  // 原版跑步循环（图集顺序）：跨步 → 小步 → 前倾 → 蓄力 → 蹬伸，全部朝右
  if (!P.onGround) return { img: MINNIE_JUMP_T, dir: 1 };
  const spd = Math.abs(P.vx);
  if (spd > 10) return { img: MINNIE_RUN_CYCLE[Math.floor(P.runPhase) % 4], dir: 1 };
  return { img: MINNIE_IDLE_T, dir: 1 };   // 帧为正面视角，两侧通用
}
function elmyraSprite(){
  if (state === "caught") return { img: MICKEY_IDLE_T, dir: 1 };
  if (state === "start" || graceT > 0) return { img: MICKEY_IDLE_T, dir: 1 };   // 开场面向玩家站立
  if (E.state === "stop") return { img: MICKEY_IDLE_T, dir: 1 };
  return { img: MICKEY_RUN_CYCLE[Math.floor(E.animT * 10) % 4], dir: 1 };
}
function drawChar(){
  const es = elmyraSprite();
  const eFlip = state === "caught" ? (P.x > E.x) : (es.dir !== 0 && E.facing !== es.dir);
  shadowAt(E.x, E.y, 0, 7);
  drawSpr(es.img, E.x, E.y, eFlip);
  if (state === "play" && E.state === "stop"){
    const sx2 = E.x + E.facing * 10, sy2 = E.y - 34 + Math.sin(E.animT * 8) * 1.5;
    ctx.fillStyle = "#8ad4ff"; ctx.fillRect(sx2, sy2, 2, 3);
  }
  if (state === "play" && E.state === "stop" && Math.floor(E.animT * 3) % 2 === 0)
    text("!", E.x, E.y - 42, 10, "#ffd24a", "center", true);

  if (state !== "caught"){
    const sup = supportUnder(P.x, P.y);
    shadowAt(P.x, sup, sup - P.y, 6);
    const k1 = Math.max(0, P.stretch);
    let sx = 1 - 0.15 * k1, sy = 1 + 0.22 * k1;
    const k2 = P.squashT / 0.14;
    if (k2 > 0){ sx = 1 + 0.2 * k2; sy = 1 - 0.25 * k2; }
    const ps = playerSprite();
    const flip = ps.dir !== 0 && P.facing !== ps.dir;
    if (!(state === "play" && graceT > 0 && Math.floor(P.animT * 10) % 2))
      drawSpr(ps.img, P.x, P.y, flip, sx, sy);
  } else {
    shadowAt(P.x, P.y, 0, 6);
    drawSpr(MINNIE_JUMP_T, P.x, P.y + 2, P.facing < 0, 1.25, 0.7);
  }
}
function drawParts(){
  for (const p of parts){
    if (p.kind === "heart"){
      ctx.globalAlpha = Math.min(1, p.t);
      ctx.drawImage(HEART_SPR, Math.floor(p.x) - 4, Math.floor(p.y) - 4);
    } else if (p.kind === "sweat"){
      ctx.globalAlpha = Math.min(1, p.t * 2);
      ctx.fillStyle = "#8ad4ff"; ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 2, 3);
    } else {
      ctx.globalAlpha = p.t * 2.5;
      ctx.fillStyle = "#e8e0cc";
      ctx.fillRect(Math.floor(p.x) - 1, Math.floor(p.y) - 1, 3, 3);
    }
    ctx.globalAlpha = 1;
  }
}
/* 原版风格底部 HUD：黑条 + 生命 + 开门进度 + 分数 */
function textHUD(s, x, size, color, align){
  ctx.font = "bold " + size + "px 'Microsoft YaHei','SimHei',sans-serif";
  ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  const m = ctx.measureText(s);
  const asc = m.actualBoundingBoxAscent || size * 0.8;
  const desc = m.actualBoundingBoxDescent || size * 0.2;
  const y = 228 + (asc - desc) / 2;                    // 字形实际边界对齐中线 228
  ctx.fillStyle = "#000";
  for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]]) ctx.fillText(s, x + ox, y + oy);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function drawHUD(){
  const CY = 228;                       // HUD 条垂直中线：爱心/文字/进度条全部对齐此线
  ctx.fillStyle = "#000"; ctx.fillRect(0, 216, W, 24);
  ctx.fillStyle = "#f8f8f8"; ctx.fillRect(0, 216, W, 1); ctx.fillRect(0, 239, W, 1);
  // 生命：爱心 + P×N
  for (let i = 0; i < lives; i++) ctx.drawImage(HEART_SPR, 6 + i * 9, CY - 4);
  textHUD("P×" + lives, 60, 10, "#f8f8f8", "left");
  // 开门进度条
  const bw = 62, bx = 122, by = CY - 4;
  textHUD("DOOR", bx - 4, 10, "#f8f8f8", "right");
  ctx.fillStyle = "#45283c"; ctx.fillRect(bx, by, bw, 8);
  const r = Math.min(1, survT / doorTime);
  ctx.fillStyle = r > .8 ? "#f85838" : "#f8b800";
  ctx.fillRect(bx + 1, by + 1, (bw - 2) * r, 6);
  // 分数
  textHUD(String(Math.floor(score)).padStart(7, "0"), 250, 10, "#f8b800", "right");
}
function drawTitle(){
  ctx.fillStyle = "#10101c"; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++){
    const x = (i * 97) % W, y = (i * 53) % 190;
    ctx.fillStyle = (i % 3) ? "#2a2a4a" : "#3a3a66";
    ctx.fillRect(x, y, 2, 2);
  }
  text("米奇追米妮", 128, 30, 24, "#ffd24a", "center", true);
  text("~ 甜蜜追逐战 · 横版复刻 ~", 128, 60, 13, "#ff9fc0", "center", true);
  const t = performance.now() / 1000;
  const fr = MINNIE_RUN_CYCLE[Math.floor(t * 10) % 4];
  const ef = MICKEY_RUN_CYCLE[Math.floor(t * 10) % 4];
  const dirDemo = Math.cos(t * 1.8) < 0 ? -1 : 1;      // 移动方向
  const bx = 128 + Math.sin(t * 1.8) * 60;             // 兔宝宝在前跑
  const ex = bx - dirDemo * 46;                        // 爱心女追在身后
  ctx.drawImage(HEART_SPR, Math.floor(ex) - 26, 96 + Math.sin(t * 4) * 3);
  ctx.drawImage(HEART_SPR, Math.floor(ex) + 30, 100 + Math.cos(t * 4) * 3);
  ctx.save(); ctx.translate(Math.floor(bx), 0);
  if (dirDemo < 0) ctx.scale(-1, 1);
  ctx.drawImage(fr, -Math.round(fr.width / 2), 118 - fr.height); ctx.restore();
  // Elmyra 原帧朝左：向左追不翻转，向右追镜像
  ctx.save(); ctx.translate(Math.floor(ex), 0);
  if (dirDemo < 0) ctx.scale(-1, 1);
  ctx.drawImage(ef, -Math.round(ef.width / 2), 120 - ef.height); ctx.restore();

  text("帮助米妮摆脱多情男同事：跳过他换边！", 128, 126, 10, "#fff");
  text("坚持到 门 出现，趁他停下喘气时钻进去逃生", 128, 142, 10, "#ffd24a");
  text("←→ 原版式奔跑（按住即全速） ↑/空格 大跳（按住更高）", 128, 164, 10, "#9fd8ff");
  text("↓ 下平台   被抱住会回到房间开头", 128, 178, 10, "#9fd8ff");
  text("M 静音", 128, 194, 9, "#8888aa");
  if (Math.floor(t * 2) % 2 === 0) text("- 按 回车 或 点击画面 开始 -", 128, 212, 12, "#fff", "center", true);
  text("v2.1", 250, 228, 9, "#55557a", "right");
}
function render(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * 5, (Math.random() - .5) * 5);

  if (state === "title"){ drawTitle(); ctx.restore(); return; }

  drawRoom();
  drawChar();
  drawParts();

  if (state === "start") text(stT > 0.5 ? "准备……" : "跑！！", 128, 92, 20, "#fff", "center", true);
  if (state === "clear"){
    ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fillRect(0, 0, W, H);
    text("逃出来了！", 128, 92, 20, "#ffd24a", "center", true);
  }
  for (let i = 0; i < floats.length; i++){
    const f = floats[i];
    text(f.text, 128, 112 + i * 16 - (1.6 - Math.min(1.6, f.t)) * 6, 12, f.color, "center", true);
  }
  drawHUD();

  if (state === "over"){
    ctx.fillStyle = "rgba(0,0,0,.78)"; ctx.fillRect(0, 0, W, 216);
    text("游戏结束", 128, 70, 24, "#ff5a5a", "center", true);
    ctx.drawImage(HEART_SPR, 96, 112); ctx.drawImage(HEART_SPR, 152, 112);
    text("最终分数 " + Math.floor(score), 128, 104, 14, "#ffd24a", "center", true);
    text("坚持到第 " + round + " 关", 128, 126, 11, "#fff");
    if (Math.floor(performance.now() / 500) % 2 === 0)
      text("- 按 回车 再来一次 -", 128, 154, 12, "#fff", "center", true);
  }

  ctx.restore();
}

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 开场自动出声：打开页面即尝试播放；被浏览器拦截时，第一次点击/按键立即响起 */
try {
  ensureAudio();
  playBGM(state === "title" || state === "over" ? "title" : "level");
} catch(e){}
if (typeof AC !== "undefined" && AC && AC.state === "suspended"){
  const wakeAudio = () => { ensureAudio(); if (AC.state === "suspended") AC.resume(); };
  addEventListener("pointerdown", wakeAudio, { capture: true });
  addEventListener("keydown", wakeAudio, { capture: true });
  addEventListener("touchend", wakeAudio, { capture: true });
}
</script>
